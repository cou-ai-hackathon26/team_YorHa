name: Android APK

# Builds the side-loadable MediDiary APKs (two flavors):
#  • offline → MediDiary-<v>.apk         no network permission at all (enforced below)
#  • family  → MediDiary-<v>-family.apk  + opt-in end-to-end-encrypted family sync (INTERNET only)
#  • every push / pull request → unit tests + APK artifact (downloadable from the run page)
#  • push a tag like v1.0.0      → also publishes a GitHub Release with the APK attached (direct link for judges)
# Model files (Whisper / Gemma) are never part of the APK; see README "Model files".

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write # only used by the Release step on v* tags
    env:
      NDK_VERSION: "27.2.12479018"
      CMAKE_VERSION: "3.22.1"
      HAS_KEYSTORE: ${{ secrets.MEDIDIARY_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout (with whisper.cpp + llama.cpp submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with dependency cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Install NDK, CMake and SDK platform
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          ls "$ANDROID_HOME/ndk"

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="1.0.0-ci.${GITHUB_RUN_NUMBER}"; fi
          echo "MEDIDIARY_VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "Version name: $V, version code: $GITHUB_RUN_NUMBER"

      # whisper.cpp + llama.cpp take most of the build time; reuse CMake outputs when sources are unchanged.
      - name: Native cache key
        id: native
        run: echo "sub=$(git submodule status | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache native (.cxx) builds
        uses: actions/cache@v6
        with:
          path: |
            app/.cxx
            whisper/.cxx
            llama/.cxx
          key: cxx-${{ env.NDK_VERSION }}-${{ steps.native.outputs.sub }}-${{ hashFiles('app/src/main/cpp/**', 'whisper/src/main/cpp/**', 'llama/src/main/cpp/**', 'app/build.gradle.kts', 'whisper/build.gradle.kts', 'llama/build.gradle.kts', 'gradle.properties') }}
          restore-keys: |
            cxx-${{ env.NDK_VERSION }}-${{ steps.native.outputs.sub }}-

      - name: Unit tests
        run: ./gradlew :app:testOfflineDebugUnitTest :app:testFamilyDebugUnitTest --stacktrace

      - name: Decode release keystore (optional)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.MEDIDIARY_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/medidiary-release.jks"
          echo "MEDIDIARY_KEYSTORE_FILE=$RUNNER_TEMP/medidiary-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          MEDIDIARY_KEYSTORE_PASSWORD: ${{ secrets.MEDIDIARY_KEYSTORE_PASSWORD }}
          MEDIDIARY_KEY_ALIAS: ${{ secrets.MEDIDIARY_KEY_ALIAS }}
          MEDIDIARY_KEY_PASSWORD: ${{ secrets.MEDIDIARY_KEY_PASSWORD }}
          # Optional: without these the family APK builds but shows "sync not configured".
          MEDIDIARY_FIREBASE_API_KEY: ${{ secrets.MEDIDIARY_FIREBASE_API_KEY }}
          MEDIDIARY_FIREBASE_APP_ID: ${{ secrets.MEDIDIARY_FIREBASE_APP_ID }}
          MEDIDIARY_FIREBASE_PROJECT_ID: ${{ secrets.MEDIDIARY_FIREBASE_PROJECT_ID }}
        run: ./gradlew :app:assembleOfflineRelease :app:assembleFamilyRelease --stacktrace

      - name: Verify APKs (permissions, native libs, signature)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "## MediDiary APKs" >> "$GITHUB_STEP_SUMMARY"
          echo "| Flavor | File | Size | SHA-256 | Network permissions |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for FLAVOR in offline family; do
            APK=app/build/outputs/apk/$FLAVOR/release/app-$FLAVOR-release.apk
            "$BT/aapt2" dump permissions "$APK" | tee "permissions-$FLAVOR.txt"
            NET=$(grep -oE "android\.permission\.[A-Z_]*(INTERNET|NETWORK)[A-Z_]*" "permissions-$FLAVOR.txt" | sort -u | tr '\n' ' ')
            if [ "$FLAVOR" = offline ] && [ -n "$NET" ]; then
              echo "::error::Network permission found in the offline APK ($NET). It must stay 100% offline."
              exit 1
            fi
            if [ "$FLAVOR" = family ]; then
              EXTRA=$(grep -oE "android\.permission\.[A-Z_]*(INTERNET|NETWORK)[A-Z_]*" "permissions-$FLAVOR.txt" | sort -u \
                | grep -vE "^android\.permission\.(INTERNET|ACCESS_NETWORK_STATE)$" || true)
              [ -z "$EXTRA" ] || { echo "::error::Unexpected network permission in the family APK: $EXTRA"; exit 1; }
            fi
            for lib in libmedidiary_whisper.so libmedidiary_llama.so; do
              unzip -l "$APK" | grep -q "lib/arm64-v8a/$lib" || { echo "::error::$lib missing from $FLAVOR APK"; exit 1; }
            done
            "$BT/apksigner" verify --print-certs "$APK" | tee "signing-$FLAVOR.txt"
            if [ "$FLAVOR" = offline ]; then OUT="MediDiary-${MEDIDIARY_VERSION_NAME}.apk"; else OUT="MediDiary-${MEDIDIARY_VERSION_NAME}-family.apk"; fi
            cp "$APK" "$OUT"
            echo "APK_${FLAVOR^^}=$OUT" >> "$GITHUB_ENV"
            echo "| $FLAVOR | \`$OUT\` | $(du -h "$OUT" | cut -f1) | \`$(sha256sum "$OUT" | cut -c1-16)…\` | ${NET:-none ✅} |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Version ${MEDIDIARY_VERSION_NAME} (code ${GITHUB_RUN_NUMBER}) · signing: $([ "$HAS_KEYSTORE" = true ] && echo 'release key (secrets)' || echo 'CI debug key, uninstall before installing a newer build')" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload offline APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.APK_OFFLINE }}
          archive: false # download the .apk directly, not a zip
          retention-days: 30
          if-no-files-found: error

      - name: Upload family APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.APK_FAMILY }}
          archive: false
          retention-days: 30
          if-no-files-found: error

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          retention-days: 7

      - name: Publish GitHub Release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.APK_OFFLINE }}
            ${{ env.APK_FAMILY }}
          generate_release_notes: true
          body: |
            **MediDiary ${{ env.MEDIDIARY_VERSION_NAME }}** — offline, bilingual (Bangla + English) health diary.

            Install: download the APK below on an arm64 Android 8+ phone and allow "Install unknown apps".
            The on-device AI models are not included in the APK (size). Load them via **Settings → Load model**:
            `medidiary-whisper.bin` (Whisper, ggml) and `medidiary-gemma.gguf` (Gemma 3 1B, GGUF). See the README.

            Patient-Reported & AI-Assisted, Not Medically Verified.
